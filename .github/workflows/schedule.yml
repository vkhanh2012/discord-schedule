name: Gui Thong Bao Discord Tap Trung

on:
  schedule:
    # Chạy mỗi ngày vào lúc 19:30 Giờ VN (= 12:00 UTC)
    - cron: '30 12 * * *'
  
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python Script
        run: python lich_hoc.py
